<div class="registration-container">
  <div class="registration-header">
    <button class="back-button" (click)="onBack()">
      <i class="fas fa-arrow-left"></i> Retour
    </button>
    <h2>Finaliser votre rendez-vous</h2>
    <p class="appointment-summary" *ngIf="selectedSlot">
      <i class="far fa-calendar"></i> 
      {{ selectedSlot.startTime | date:'EEEE d MMMM yyyy':'':'fr' }}
      <i class="far fa-clock"></i>
      {{ selectedSlot.startTime | date:'HH:mm' }}
    </p>
  </div>

  <div class="form-toggle">
    <button 
      class="toggle-btn" 
      [class.active]="!showLoginForm"
      (click)="showLoginForm = false"
    >
      Nouveau patient
    </button>
    <button 
      class="toggle-btn" 
      [class.active]="showLoginForm"
      (click)="showLoginForm = true"
    >
      Déjà inscrit
    </button>
  </div>

  <!-- Login Form -->
  <form *ngIf="showLoginForm" [formGroup]="loginForm" (ngSubmit)="onSubmitLogin()">
    <div class="form-section">
      <h3>Connexion</h3>
      
      <div class="form-group">
        <label for="login-email">Courriel *</label>
        <input 
          type="email" 
          id="login-email"
          formControlName="email"
          class="form-control"
          placeholder="email@exemple.com"
        >
      </div>

      <div class="form-group">
        <label for="login-password">Mot de passe *</label>
        <input 
          type="password" 
          id="login-password"
          formControlName="password"
          class="form-control"
        >
      </div>

      <div class="error-message" *ngIf="errorMessage">
        <i class="fas fa-exclamation-circle"></i> {{ errorMessage }}
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary" [disabled]="isLoading || loginForm.invalid">
          <span *ngIf="!isLoading">Se connecter et réserver</span>
          <span *ngIf="isLoading">
            <i class="fas fa-spinner fa-spin"></i> Connexion...
          </span>
        </button>
      </div>
    </div>
  </form>

  <!-- Registration Form -->
  <form *ngIf="!showLoginForm" [formGroup]="registrationForm" (ngSubmit)="onSubmitRegistration()">
    <div class="form-section">
      <h3>Inscription</h3>
      
      <!-- Appointment For -->
      <div class="form-group">
        <label>Je prends ce rendez-vous pour:</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" formControlName="appointmentFor" value="Moi-même">
            <span>Moi-même</span>
          </label>
          <label class="radio-label">
            <input type="radio" formControlName="appointmentFor" value="Quelqu'un d'autre">
            <span>Quelqu'un d'autre</span>
          </label>
        </div>
      </div>

      <!-- Name Fields -->
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">Prénom *</label>
          <input 
            type="text" 
            id="firstName"
            formControlName="firstName"
            class="form-control"
          >
        </div>
        <div class="form-group">
          <label for="secondName">Deuxième prénom</label>
          <input 
            type="text" 
            id="secondName"
            formControlName="secondName"
            class="form-control"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="lastName">Nom de famille *</label>
        <input 
          type="text" 
          id="lastName"
          formControlName="lastName"
          class="form-control"
        >
      </div>

      <!-- Gender -->
      <div class="form-group">
        <label for="gender">Genre *</label>
        <select id="gender" formControlName="gender" class="form-control">
          <option value="">Choisissez...</option>
          <option value="MALE">Homme</option>
          <option value="FEMALE">Femme</option>
          <option value="OTHER">Autre</option>
        </select>
      </div>

      <!-- Date of Birth -->
      <div class="form-group">
        <label>Date de naissance *</label>
        <div formGroupName="dateOfBirth" class="date-inputs">
          <input 
            type="number" 
            formControlName="year"
            placeholder="Année"
            min="1900"
            [max]="2024"
            class="form-control"
          >
          <select formControlName="month" class="form-control">
            <option value="">Mois</option>
            <option value="01">Janvier</option>
            <option value="02">Février</option>
            <option value="03">Mars</option>
            <option value="04">Avril</option>
            <option value="05">Mai</option>
            <option value="06">Juin</option>
            <option value="07">Juillet</option>
            <option value="08">Août</option>
            <option value="09">Septembre</option>
            <option value="10">Octobre</option>
            <option value="11">Novembre</option>
            <option value="12">Décembre</option>
          </select>
          <input 
            type="number" 
            formControlName="day"
            placeholder="Jour"
            min="1"
            max="31"
            class="form-control"
          >
        </div>
      </div>

      <!-- Health Card -->
      <div class="form-group">
        <label for="healthCardNumber">Numéro d'assurance-maladie</label>
        <input 
          type="text" 
          id="healthCardNumber"
          formControlName="healthCardNumber"
          class="form-control"
        >
      </div>

      <!-- Contact Information -->
      <div class="form-group">
        <label for="email">Courriel *</label>
        <input 
          type="email" 
          id="email"
          formControlName="email"
          class="form-control"
          placeholder="email@exemple.com"
        >
      </div>

      <div class="form-group">
        <label for="password">Mot de passe *</label>
        <input 
          type="password" 
          id="password"
          formControlName="password"
          class="form-control"
          placeholder="Minimum 8 caractères"
        >
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="mobilePhone">Téléphone mobile</label>
          <input 
            type="tel" 
            id="mobilePhone"
            formControlName="mobilePhone"
            class="form-control"
          >
        </div>
        <div class="form-group">
          <label for="homePhone">Téléphone maison</label>
          <input 
            type="tel" 
            id="homePhone"
            formControlName="homePhone"
            class="form-control"
          >
        </div>
      </div>

      <!-- Address -->
      <div class="form-group">
        <label for="address">Adresse</label>
        <input 
          type="text" 
          id="address"
          formControlName="address"
          class="form-control"
          placeholder="123 Rue Exemple"
        >
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="city">Ville</label>
          <input 
            type="text" 
            id="city"
            formControlName="city"
            class="form-control"
          >
        </div>
        <div class="form-group">
          <label for="province">Province</label>
          <select id="province" formControlName="province" class="form-control">
            <option value="">Choisissez...</option>
            <option *ngFor="let prov of provinces" [value]="prov.value">
              {{ prov.label }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label for="postalCode">Code postal</label>
          <input 
            type="text" 
            id="postalCode"
            formControlName="postalCode"
            class="form-control"
          >
        </div>
      </div>

      <!-- Terms -->
      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="termsAccepted">
          <span>
            J'ai lu, compris et accepté les 
            <a href="/terms" target="_blank">conditions d'utilisation</a> 
            et la 
            <a href="/privacy" target="_blank">politique de confidentialité</a>.
          </span>
        </label>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        <i class="fas fa-exclamation-circle"></i> {{ errorMessage }}
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary" [disabled]="isLoading || registrationForm.invalid">
          <span *ngIf="!isLoading">S'inscrire et réserver</span>
          <span *ngIf="isLoading">
            <i class="fas fa-spinner fa-spin"></i> Inscription...
          </span>
        </button>
      </div>
    </div>
  </form>
</div>
