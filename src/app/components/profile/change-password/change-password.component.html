<div class="container mx-auto px-4 py-8">
  <div class="max-w-md mx-auto">
    <h1 class="text-3xl font-bold mb-6">Changer le mot de passe</h1>
    
    <div *ngIf="success" class="alert alert-success mb-4" role="alert">
      Mot de passe changé avec succès! Redirection...
    </div>
    
    <div *ngIf="error" class="alert alert-danger mb-4" role="alert">
      {{ error }}
    </div>

    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="bg-white shadow rounded-lg p-6">
      <div class="mb-4">
        <label for="currentPassword" class="block text-sm font-medium text-gray-700 mb-2">
          Mot de passe actuel <span class="text-red-500">*</span>
        </label>
        <input
          type="password"
          id="currentPassword"
          formControlName="currentPassword"
          class="form-control"
          [class.is-invalid]="passwordForm.get('currentPassword')?.invalid && passwordForm.get('currentPassword')?.touched"
        />
        <div *ngIf="passwordForm.get('currentPassword')?.invalid && passwordForm.get('currentPassword')?.touched" class="invalid-feedback">
          Mot de passe requis (minimum 6 caractères)
        </div>
      </div>

      <div class="mb-4">
        <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-2">
          Nouveau mot de passe <span class="text-red-500">*</span>
        </label>
        <input
          type="password"
          id="newPassword"
          formControlName="newPassword"
          class="form-control"
          [class.is-invalid]="passwordForm.get('newPassword')?.invalid && passwordForm.get('newPassword')?.touched"
        />
        <div *ngIf="passwordForm.get('newPassword')?.invalid && passwordForm.get('newPassword')?.touched" class="invalid-feedback">
          Le nouveau mot de passe doit contenir au moins 8 caractères
        </div>
      </div>

      <div class="mb-6">
        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">
          Confirmer le nouveau mot de passe <span class="text-red-500">*</span>
        </label>
        <input
          type="password"
          id="confirmPassword"
          formControlName="confirmPassword"
          class="form-control"
          [class.is-invalid]="passwordForm.get('confirmPassword')?.hasError('passwordMismatch') && passwordForm.get('confirmPassword')?.touched"
        />
        <div *ngIf="passwordForm.get('confirmPassword')?.hasError('passwordMismatch') && passwordForm.get('confirmPassword')?.touched" class="invalid-feedback">
          Les mots de passe ne correspondent pas
        </div>
      </div>

      <div class="flex justify-end space-x-3">
        <button
          type="button"
          (click)="onCancel()"
          class="btn btn-secondary"
        >
          Annuler
        </button>
        <button
          type="submit"
          [disabled]="passwordForm.invalid || loading"
          class="btn btn-primary"
        >
          <span *ngIf="!loading">Changer le mot de passe</span>
          <span *ngIf="loading">
            <i class="fas fa-spinner fa-spin"></i> Changement...
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
