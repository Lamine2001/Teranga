<div class="container mx-auto px-4 py-8">
  <div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold mb-6">Modifier le Profil</h1>
    
    <div *ngIf="success" class="alert alert-success mb-4" role="alert">
      Profil mis à jour avec succès! Redirection...
    </div>
    
    <div *ngIf="error" class="alert alert-danger mb-4" role="alert">
      {{ error }}
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="bg-white shadow rounded-lg p-6">
      <div class="mb-4">
        <label for="firstName" class="block text-sm font-medium text-gray-700 mb-2">
          Prénom
        </label>
        <input
          type="text"
          id="firstName"
          formControlName="firstName"
          class="form-control"
          placeholder="Entrez votre prénom"
        />
      </div>

      <div class="mb-4">
        <label for="lastName" class="block text-sm font-medium text-gray-700 mb-2">
          Nom
        </label>
        <input
          type="text"
          id="lastName"
          formControlName="lastName"
          class="form-control"
          placeholder="Entrez votre nom"
        />
      </div>

      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
          Email <span class="text-red-500">*</span>
        </label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          placeholder="exemple@email.com"
          [class.is-invalid]="profileForm.get('email')?.invalid && profileForm.get('email')?.touched"
        />
        <div *ngIf="profileForm.get('email')?.invalid && profileForm.get('email')?.touched" class="invalid-feedback">
          Email invalide
        </div>
      </div>

      <div class="mb-6">
        <label for="phoneNumber" class="block text-sm font-medium text-gray-700 mb-2">
          Numéro de téléphone
        </label>
        <input
          type="tel"
          id="phoneNumber"
          formControlName="phoneNumber"
          class="form-control"
          placeholder="+221 77 123 45 67"
          [class.is-invalid]="profileForm.get('phoneNumber')?.invalid && profileForm.get('phoneNumber')?.touched"
        />
        <div *ngIf="profileForm.get('phoneNumber')?.invalid && profileForm.get('phoneNumber')?.touched" class="invalid-feedback">
          Format de téléphone invalide
        </div>
      </div>

      <div class="flex justify-end space-x-3">
        <button
          type="button"
          (click)="onCancel()"
          class="btn btn-secondary"
        >
          Annuler
        </button>
        <button
          type="submit"
          [disabled]="profileForm.invalid || loading"
          class="btn btn-primary"
        >
          <span *ngIf="!loading">Enregistrer</span>
          <span *ngIf="loading">
            <i class="fas fa-spinner fa-spin"></i> Enregistrement...
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
