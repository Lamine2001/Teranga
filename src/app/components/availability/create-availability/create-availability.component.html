<div class="availability-form-container">
  <div class="form-header">
    <h3><i class="fas fa-calendar-plus"></i> Créer une Disponibilité</h3>
    <button class="close-btn" (click)="onClose()">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <form (ngSubmit)="onSubmit()" #availabilityForm="ngForm">
    <!-- Alert Messages -->
    <div *ngIf="error" class="alert alert-danger">
      <i class="fas fa-exclamation-triangle"></i> {{ error }}
    </div>
    <div *ngIf="success" class="alert alert-success">
      <i class="fas fa-check-circle"></i> {{ success }}
    </div>

    <!-- Date et Heure de début -->
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="startDate">Date de début</label>
        <input 
          type="date" 
          class="form-control" 
          id="startDate"
          [(ngModel)]="startDate" 
          name="startDate"
          required
          [min]="startDate">
      </div>
      <div class="form-group col-md-6">
        <label for="startTime">Heure de début</label>
        <input 
          type="time" 
          class="form-control" 
          id="startTime"
          [(ngModel)]="startTimeInput" 
          name="startTime"
          required>
      </div>
    </div>

    <!-- Date et Heure de fin -->
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="endDate">Date de fin</label>
        <input 
          type="date" 
          class="form-control" 
          id="endDate"
          [(ngModel)]="endDate" 
          name="endDate"
          required
          [min]="startDate">
      </div>
      <div class="form-group col-md-6">
        <label for="endTime">Heure de fin</label>
        <input 
          type="time" 
          class="form-control" 
          id="endTime"
          [(ngModel)]="endTimeInput" 
          name="endTime"
          required>
      </div>
    </div>

    <!-- Durée des créneaux -->
    <div class="form-group">
      <label for="duration">Durée des créneaux de consultation</label>
      <select 
        class="form-control" 
        id="duration"
        [(ngModel)]="availability.durationMinutes" 
        name="duration"
        required>
        <option *ngFor="let duration of durations" [value]="duration.value">
          {{ duration.label }}
        </option>
      </select>
      <small class="form-text text-muted">
        Cette durée sera utilisée pour diviser votre disponibilité en créneaux de consultation
      </small>
    </div>

    <!-- Boutons -->
    <div class="form-actions">
      <button 
        type="submit" 
        class="btn btn-primary"
        [disabled]="loading || !availabilityForm.form.valid">
        <i class="fas fa-save" *ngIf="!loading"></i>
        <i class="fas fa-spinner fa-spin" *ngIf="loading"></i>
        {{ loading ? 'Création en cours...' : 'Créer la disponibilité' }}
      </button>
      <button 
        type="button" 
        class="btn btn-secondary"
        (click)="resetForm()">
        <i class="fas fa-redo"></i> Réinitialiser
      </button>
    </div>
  </form>
</div>
