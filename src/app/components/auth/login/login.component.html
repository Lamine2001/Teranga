<div class="user-type-selector">
  <button 
    type="button"
    [class.active]="selectedRole === 'patient'"
    (click)="selectRole('patient')"
    class="type-btn"
  >
    <i class="fas fa-user"></i>
    Patient
  </button>
  <button 
    type="button"
    [class.active]="selectedRole === 'doctor'"
    (click)="selectRole('doctor')"
    class="type-btn"
  >
    <i class="fas fa-user-md"></i>
    Médecin
  </button>
</div>
